name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build/cmake -A x64
      - name: Build
        run: cmake --build build/cmake --config Release --parallel
      - name: Unit and controller tests
        run: ctest --test-dir build/cmake -C Release --output-on-failure
      - name: Simulator scenarios
        run: build/cmake/src/tools/Release/atspilot_sim.exe
      - uses: actions/upload-artifact@v4
        with:
          name: atspilot-plugin
          path: build/cmake/src/plugin/Release/atspilot.dll
